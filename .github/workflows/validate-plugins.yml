name: Validate plugins

on:
  pull_request:
    paths:
      - ".cursor-plugin/marketplace.json"
      - "**/plugin.json"
      - "schemas/**"
      - ".agents/plugins/marketplace.json"
      - "pstack/codex/**"
      - "pstack/skills/**"
      - "pstack/agents/**"
      - "scripts/*pstack-codex.py"
      - ".github/workflows/validate-plugins.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-save ajv ajv-formats

      - name: Validate plugin definitions
        run: node scripts/validate-plugins.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Codex package and shared resources
        run: python3 scripts/validate-pstack-codex.py
